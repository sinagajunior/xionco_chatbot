server:
  port: 8080

spring:
  application:
    name: xionco-chatbot
  thymeleaf:
    cache: false
    encoding: UTF-8
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        options:
          temperature: 0.7
          num-ctx: 4096
          top-k: 40
          top-p: 0.9
      init:
        pull-model-strategy: never

app:
  name: "Xionco Chatbot"
  description: "Asisten AI Cerdas Berbasis Qwen"
  greeting: "Halo! Saya Xionco, asisten AI Anda. Ada yang bisa saya bantu?"
  placeholder: "Ketik pesan Anda di sini..."
  send-button-text: "Kirim"
  loading-text: "Xionco sedang berpikir..."
  error-text: "Maaf, terjadi kesalahan. Silakan coba lagi."
